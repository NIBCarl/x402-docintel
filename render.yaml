services:
  - type: web
    name: x402-docintel
    runtime: docker
    dockerfilePath: ./Dockerfile
    # FREE tier: $0/month. Render spins the instance down after 15 min idle and
    # cold-starts on the next request (~30-50s, billed to the caller, not to us).
    # Rationale: we earn $0 while unproven, so paying $7/mo for always-on earns
    # nothing extra. Upgrade to `starter` only after the first stranger pays.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # MAINNET, not testnet. Testnet settlement is invisible to the x402 Bazaar
      # and to the on-chain census, so a testnet deployment cannot answer the only
      # question this service exists to ask: will a stranger pay real USDC?
      - key: X402_MODE
        value: mainnet
      # Public facilitator serving scheme=exact on eip155:8453. Using it means no
      # CDP account is required. Swap to the CDP URL if you prefer Coinbase's.
      - key: FACILITATOR_URL
        value: https://facilitator.payai.network
      - key: PAY_TO_ADDRESS
        sync: false          # set in the Render dashboard; never commit a real address
      - key: NODE_ENV
        value: production

